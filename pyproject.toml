[project]
name = "barangay-project"
version = "0.1.0"
description = "Barangay Document Management System"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13",
    "docxtpl>=0.17",
    "email-validator>=2.0",
    "flask>=2.3",
    "flask-login>=0.6",
    "flask-migrate>=4.0",
    "flask-sqlalchemy>=3.0",
    "flask-wtf>=1.1",
    "gunicorn>=21.2",
    "openpyxl>=3.1",
    "pillow>=10.0.0",
    "pymysql>=1.1",
    "qrcode[pil]>=7.4",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    "sqlalchemy>=2.0",
    "waitress>=3.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyinstaller>=6.0",
    "pytest>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["barangay_project*"]
