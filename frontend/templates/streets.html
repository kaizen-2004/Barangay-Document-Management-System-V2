{% extends 'base.html' %}

{% block content %}
<div class="bdm-section-header">
  <div class="bdm-section-subtitle">Manage selectable street names for resident addresses.</div>
  <div class="bdm-section-actions">
    <a class="btn btn-success" href="{{ url_for('admin.add_street') }}">Add Street</a>
  </div>
</div>

<div class="bdm-table-card">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th>Street / Road Name</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for street in streets %}
          <tr>
            <td>{{ street.name }}</td>
            <td class="text-end text-nowrap">
              <a class="btn btn-sm btn-outline-primary" href="{{ url_for('admin.edit_street', street_id=street.id) }}" title="Edit"><i class="fas fa-pen"></i></a>
              <form method="POST" action="{{ url_for('admin.delete_street', street_id=street.id) }}" class="d-inline" style="vertical-align: middle;" data-confirm="Delete this street?">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="btn btn-sm btn-outline-danger" type="submit" title="Delete"><i class="fas fa-trash-can"></i></button>
              </form>
            </td>
          </tr>
        {% else %}
          <tr><td colspan="2" class="text-center text-muted p-3"><i class="fas fa-road me-2"></i>No streets found.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
