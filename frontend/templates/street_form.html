{% extends 'base.html' %}

{% block content %}
<div class="bdm-form-card">
  <form method="POST">
    {{ form.hidden_tag() }}
    <div class="form-group">
      {{ form.name.label(class="form-label") }}
      {{ form.name(class="form-control") }}
      {% for error in form.name.errors %}
        <div class="text-danger small">{{ error }}</div>
      {% endfor %}
    </div>
    <div class="bdm-form-actions">
      <button class="btn btn-primary" type="submit">{{ submit_label }}</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('admin.list_streets') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
