name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe with PyInstaller
        shell: cmd
        run: |
          pyinstaller --onedir --noconsole --name "BarangaySystem" ^
            --add-data "frontend/templates;frontend/templates" ^
            --add-data "frontend/static;frontend/static" ^
            --add-data "migrations;migrations" ^
            --add-data "frontend\static\uploads\doc_templates;frontend\static\uploads\doc_templates" ^
            --hidden-import flask ^
            --hidden-import flask_sqlalchemy ^
            --hidden-import flask_login ^
            --hidden-import flask_migrate ^
            --hidden-import flask_wtf ^
            --hidden-import sqlalchemy ^
            --hidden-import alembic ^
            --hidden-import docxtpl ^
            --hidden-import PIL ^
            --hidden-import PIL._tkinter_finder ^
            --hidden-import cv2 ^
            --hidden-import rembg ^
            --hidden-import onnxruntime ^
            --hidden-import qrcode ^
            --hidden-import reportlab ^
            --hidden-import openpyxl ^
            --hidden-import cryptography ^
            --hidden-import waitress ^
            --hidden-import email_validator ^
            --hidden-import dotenv ^
            --hidden-import numpy ^
            run_server.py

      - name: Upload .exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarangaySystem
          path: dist/BarangaySystem/
