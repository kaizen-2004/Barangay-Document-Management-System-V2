name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: barangay_test
          MYSQL_USER: barangay_user
          MYSQL_PASSWORD: barangay_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests (MySQL)
        env:
          TEST_DATABASE_URL: mysql+pymysql://barangay_user:barangay_password@127.0.0.1:3306/barangay_test?charset=utf8mb4
        run: uv run python -m pytest

  build-windows-exe:
    needs: test-mysql
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build executable
        run: uv run pyinstaller packaging/barangay_server.spec --clean

      - name: Prepare release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_bundle | Out-Null
          Copy-Item dist/barangay_server.exe release_bundle/
          Copy-Item .env.example release_bundle/
          if (Test-Path packaging/windows_bundle) {
            Copy-Item packaging/windows_bundle/* release_bundle/ -Recurse
          }
          Copy-Item docs/onprem-windows-deployment-checklist.md release_bundle/
          if (Test-Path scripts/windows) {
            Copy-Item scripts/windows release_bundle/windows-scripts -Recurse
          }
          Compress-Archive -Path release_bundle/* -DestinationPath barangay_server_windows_plug_and_play.zip -Force

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: barangay-server-windows
          path: |
            dist/barangay_server.exe
            barangay_server_windows_plug_and_play.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/barangay_server.exe
            barangay_server_windows_plug_and_play.zip
